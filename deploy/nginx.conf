# Codenyr Prospection — site nginx (M12).
# À copier dans /etc/nginx/sites-available/prospection puis : ln -s ../sites-available/prospection /etc/nginx/sites-enabled/
# Remplacer prospection.exemple.fr par le sous-domaine choisi. Le certificat HTTPS est créé par
# « certbot --nginx -d prospection.exemple.fr », qui complète ce fichier automatiquement.

server {
    listen 80;
    listen [::]:80;
    server_name prospection.exemple.fr;

    root /var/www/prospection/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M; # imports CSV

    # En-têtes de sécurité (l'outil contient des données personnelles).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Jamais de fichiers cachés (.env, .git…).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
