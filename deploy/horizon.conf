# Codenyr Prospection — Horizon supervisé (M12).
# À copier dans /etc/supervisor/conf.d/horizon.conf, puis :
#   supervisorctl reread && supervisorctl update && supervisorctl start horizon
# Supervisor redémarre Horizon s'il s'arrête, et au redémarrage du serveur.

[program:horizon]
process_name=%(program_name)s
command=php /var/www/prospection/artisan horizon
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/prospection/storage/logs/horizon.log
stopwaitsecs=960
