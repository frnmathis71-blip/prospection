name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Pint et tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, redis, intl, zip, pcntl, posix
          coverage: none

      - name: Installer les dépendances Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'environnement (aucun secret, valeurs de .env.example)
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Vérifier le style (Pint)
        run: vendor/bin/pint --test

      - name: Lancer les tests (Pest)
        run: php artisan test
